function bindLayerDrag(){
  document.querySelectorAll('.studio-layer').forEach(el=>{
    el.onmousedown=(e)=>{
      e.preventDefault();
      studioSelectedId = el.dataset.layer;
      const canvas = document.getElementById('studioCanvas');
      const rect = canvas.getBoundingClientRect();
      const onMove=(ev)=>{
        const x = Math.max(0, Math.min(100, ((ev.clientX-rect.left)/rect.width)*100));
        const y = Math.max(0, Math.min(100, ((ev.clientY-rect.top)/rect.height)*100));
        const l = curPage().layers.find(x2=>x2.id===studioSelectedId);
        if(l){ l.x=x; l.y=y; }
        renderLayerOnly();
      };
      const onUp=()=>{ document.removeEventListener('mousemove',onMove); document.removeEventListener('mouseup',onUp); render(); };
      document.addEventListener('mousemove',onMove); document.addEventListener('mouseup',onUp);
    };
  });
}

// ---------- native canvas rendering (no external libraries) ----------
function loadImageEl(src){ return new Promise((resolve,reject)=>{ const img=new Image(); img.onload=()=>resolve(img); img.onerror=reject; img.src=src; }); }

async function studioBuildCanvas(page){
  const scale=2;
  const baseW = page.format==='insta'?400:460;
  const baseH = page.format==='insta'?500:650;
  const canvas=document.createElement('canvas');
  canvas.width=baseW*scale; canvas.height=baseH*scale;
  const ctx=canvas.getContext('2d');

  if(page.bg.type==='color'){
    ctx.fillStyle=page.bg.color||'#0B1C3D'; ctx.fillRect(0,0,canvas.width,canvas.height);
  } else if(page.bg.image){
    try{
      const img = await loadImageEl(page.bg.image);
      const cw=canvas.width, ch=canvas.height;
      const ir=img.width/img.height, cr=cw/ch;
      let dw,dh,dx,dy;
      if(ir>cr){ dh=ch; dw=ch*ir; dx=(cw-dw)/2; dy=0; } else { dw=cw; dh=cw/ir; dx=0; dy=(ch-dh)/2; }
      if(page.bg.filter==='bw') ctx.filter='grayscale(1)';
      ctx.drawImage(img,dx,dy,dw,dh);
      ctx.filter='none';
      if(page.bg.filter==='overlay'){ ctx.fillStyle='rgba(0,0,0,'+(page.bg.filterOpacity/100)+')'; ctx.fillRect(0,0,cw,ch); }
    }catch(e){ ctx.fillStyle='#0B1C3D'; ctx.fillRect(0,0,canvas.width,canvas.height); }
  } else {
    ctx.fillStyle='#0B1C3D'; ctx.fillRect(0,0,canvas.width,canvas.height);
  }

  if(document.fonts && document.fonts.ready){ try{ await document.fonts.ready; }catch(e){} }

  for(const l of page.layers){
    const px = l.x/100*canvas.width, py = l.y/100*canvas.height;
    if(l.type==='text'){
      const fam = STUDIO_FONT_FAMILY[l.font] || 'sans-serif';
      const weight = STUDIO_WEIGHTS[l.weight] || 400;
      const size = (l.size||28)*scale;
      ctx.font = weight+' '+size+'px "'+fam+'"';
      ctx.textBaseline='middle';
      ctx.textAlign = l.align||'left';
      const lines = (l.text||'').split('\n');
      const lineHeight = size*1.3;
      const totalHeight = lineHeight*lines.length;
      const startY = py - totalHeight/2 + lineHeight/2;
      if(l.highlight==='형광펜'){
        ctx.save();
        ctx.globalAlpha=(l.highlightOpacity||50)/100;
        ctx.fillStyle='#FFEB3B';
        lines.forEach((ln,idx)=>{
          const w=ctx.measureText(ln).width;
          let rx; if(l.align==='left') rx=px; else if(l.align==='right') rx=px-w; else rx=px-w/2;
          ctx.fillRect(rx, startY+idx*lineHeight+size*0.15, w, size*0.55);
        });
        ctx.restore();
      }
      ctx.fillStyle = l.color||'#FFFFFF';
      lines.forEach((ln,idx)=>{ ctx.fillText(ln, px, startY+idx*lineHeight); });
    } else if(l.type==='image' && l.image){
      try{
        const img = await loadImageEl(l.image);
        const w=(l.scale||100)*scale;
        const h=w*(img.height/img.width);
        ctx.drawImage(img, px-w/2, py-h/2, w, h);
      }catch(e){}
    }
  }
  return canvas;
}

function sanitizeFileName(n){ return (n||'cover').replace(/[\\/:*?"<>|\s]+/g,'_'); }
function downloadDataUrl(dataUrl, filename){ const a=document.createElement('a'); a.href=dataUrl; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); }
function downloadBlobFile(blob, filename){ const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),3000); }

// ---- minimal dependency-free PDF writer (embeds JPEG pages) ----
function strToBytes(s){ return new TextEncoder().encode(s); }
function base64ToBytes(base64){ const bin=atob(base64); const bytes=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i); return bytes; }
function buildPdfFromCanvases(canvases){
  const parts=[]; let offset=0; const xrefOffsets={};
  function push(x){ const b=typeof x==='string'?strToBytes(x):x; parts.push(b); offset+=b.length; }
  function writeObj(num, body){ xrefOffsets[num]=offset; push(num+' 0 obj\n'+body+'\nendobj\n'); }
  function writeStreamObj(num, dict, bytes){ xrefOffsets[num]=offset; push(num+' 0 obj\n<< '+dict+' /Length '+bytes.length+' >>\nstream\n'); push(bytes); push('\nendstream\nendobj\n'); }

  push('%PDF-1.4\n');
  let n=1;
  const catalogNum=n++, pagesNum=n++;
  const imgNums=[], contentNums=[], pageNums=[];
  const N=canvases.length;
  for(let i=0;i<N;i++){ imgNums.push(n++); contentNums.push(n++); pageNums.push(n++); }

  writeObj(catalogNum, '<< /Type /Catalog /Pages '+pagesNum+' 0 R >>');
  writeObj(pagesNum, '<< /Type /Pages /Kids ['+pageNums.map(x=>x+' 0 R').join(' ')+'] /Count '+N+' >>');

  for(let i=0;i<N;i++){
    const canvas=canvases[i];
    const jpegBytes = base64ToBytes(canvas.toDataURL('image/jpeg',0.92).split(',')[1]);
    const w=canvas.width, h=canvas.height, pw=w/2, ph=h/2;
    writeStreamObj(imgNums[i], '/Type /XObject /Subtype /Image /Width '+w+' /Height '+h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode', jpegBytes);
    const contentBytes = strToBytes('q '+pw+' 0 0 '+ph+' 0 0 cm /Im0 Do Q');
    writeStreamObj(contentNums[i], '', contentBytes);
    writeObj(pageNums[i], '<< /Type /Page /Parent '+pagesNum+' 0 R /MediaBox [0 0 '+pw+' '+ph+'] /Resources << /XObject << /Im0 '+imgNums[i]+' 0 R >> >> /Contents '+contentNums[i]+' 0 R >>');
  }

  const xrefStart=offset;
  const total=n-1;
  let xrefStr='xref\n0 '+(total+1)+'\n0000000000 65535 f \n';
  for(let k=1;k<=total;k++){ xrefStr += String(xrefOffsets[k]||0).padStart(10,'0')+' 00000 n \n'; }
  push(xrefStr);
  push('trailer\n<< /Size '+(total+1)+' /Root '+catalogNum+' 0 R >>\nstartxref\n'+xrefStart+'\n%%EOF');

  return new Blob(parts, {type:'application/pdf'});
}

async function studioDownloadCurrent(){
  const page = curPage();
  const canvas = await studioBuildCanvas(page);
  if(studioDownloadFormat==='png'){
    downloadDataUrl(canvas.toDataURL('image/png'), sanitizeFileName(page.name)+'.png');
  } else {
    downloadBlobFile(buildPdfFromCanvases([canvas]), sanitizeFileName(page.name)+'.pdf');
  }
}
async function studioDownloadAll(){
  if(studioDownloadFormat==='pdf'){
    const canvases=[];
    for(const pg of studioPages){ canvases.push(await studioBuildCanvas(pg)); }
    downloadBlobFile(buildPdfFromCanvases(canvases), 'cover_set.pdf');
  } else {
    for(const pg of studioPages){
      const canvas = await studioBuildCanvas(pg);
      downloadDataUrl(canvas.toDataURL('image/png'), sanitizeFileName(pg.name)+'.png');
      await new Promise(res=>setTimeout(res,250));
    }
  }
}
// lightweight re-render of just the canvas layers (used during live drag/typing to avoid losing focus)
function renderLayerOnly(){
  const canvas=document.getElementById('studioCanvas');
  if(!canvas) return;
  canvas.querySelectorAll('.studio-layer').forEach(el=>el.remove());
  canvas.insertAdjacentHTML('beforeend', curPage().layers.map(l=>studioRenderLayer(l)).join(''));
  bindLayerDrag();
}

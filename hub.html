<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HYE-ritage</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+KR:wght@300;400;500;700&family=DM+Mono:wght@400;500&family=DM+Serif+Display&family=Playfair+Display:wght@400;700&family=Bebas+Neue&family=Gowun+Batang:wght@400;700&family=Black+Han+Sans&family=Nanum+Myeongjo:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFFFFF; --panel:#F5F7FC; --navy:#0B1C3D; --ink-soft:#5C6478; --ink-faint:#9AA1B4;
    --royal:#0B0EA6; --royal-dark:#03096D; --royal-soft:#E6E7FA; --line:#E3E6EF;
    --trk-none:#EDEEF3; --trk-low:#F3B4A6; --trk-mid:#F7CD8B; --trk-high:#9BDBB4;
    --amber:#B4801F; --amber-soft:#FBF1DC; --brick:#C24A3A; --brick-soft:#FBE4E0;
    --green:#1F8A5F; --green-soft:#E1F3EA; --radius:12px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--navy);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  #cover{min-height:100vh;background:#020950;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;padding:24px;text-align:center;}
  .cover-mark{font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:0.2em;color:#8C9AE8;text-transform:uppercase;margin-bottom:18px;}
  .cover-name{font-size:clamp(32px,6vw,52px);font-weight:700;line-height:1.15;outline:none;cursor:text;}
  .cover-sub{margin-top:14px;color:#A7B0D8;font-size:15px;outline:none;cursor:text;}
  .cover-enter{margin-top:44px;background:transparent;color:#fff;border:none;padding:0;font-size:15px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;letter-spacing:0.02em;}
  .cover-enter:hover{opacity:0.75;}

  #app{display:none;min-height:100vh;}
  .topnav{display:flex;align-items:center;justify-content:space-between;padding:14px 28px;position:sticky;top:0;background:var(--navy);z-index:10;border-bottom:2px solid var(--royal);}
  .brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;font-family:'Space Grotesk',sans-serif;color:#fff;cursor:pointer;}
  .brand .dot{width:9px;height:9px;border-radius:3px;background:#7C8CF0;display:inline-block;}
  .cat-tabs{display:flex;gap:6px;}
  .cat-tab{padding:8px 16px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;color:#8C97C4;}
  .cat-tab.active{background:rgba(255,255,255,0.12);color:#fff;}
  .cat-tab.disabled{color:#4F5A85;cursor:default;position:relative;}
  .cat-tab.disabled::after{content:'준비중';font-size:9px;background:rgba(255,255,255,0.08);color:#8C97C4;padding:1px 6px;border-radius:6px;margin-left:6px;}

  .shell{display:flex;align-items:flex-start;}
  .sidebar{width:230px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);padding:18px 12px 60px;position:sticky;top:53px;height:calc(100vh - 53px);overflow-y:auto;}
  .sidebar-item{padding:9px 10px;border-radius:8px;font-size:13px;color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;gap:8px;font-weight:500;}
  .sidebar-item:hover{background:#fff;}
  .sidebar-item.active{background:var(--royal);color:#fff;}
  .sidebar-item.active .status-dot{filter:brightness(2);}
  .sidebar-title{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;margin:16px 0 6px;padding:0 10px;}
  .sidebar-title:first-child{margin-top:2px;}
  .sidebar-blog-item{font-size:12.5px;}

  .main{flex:1;min-width:0;padding:26px 30px 90px;max-width:1300px;}

  .hub-section{margin-bottom:32px;}
  .hub-section-title{font-family:'Space Grotesk',sans-serif;font-size:13px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
  .status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0;}
  .status-dot.활성{background:var(--green);}
  .status-dot.대기{background:var(--amber);}
  .status-dot.보류{background:var(--ink-faint);}

  .blog-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px;}
  .blog-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px;cursor:pointer;transition:border-color .15s,box-shadow .15s;}
  .blog-card:hover{border-color:var(--royal);box-shadow:0 4px 14px rgba(11,14,166,0.10);}
  .blog-card .name{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:16px;}
  .blog-card .platforms{font-size:11px;color:var(--ink-soft);margin-top:4px;}
  .progress-mini{margin-top:14px;display:flex;flex-direction:column;gap:7px;}
  .pm-row{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink-soft);}
  .pm-label{width:44px;flex-shrink:0;}
  .pm-bar-bg{flex:1;height:5px;border-radius:4px;background:var(--panel);overflow:hidden;}
  .pm-bar-fill{height:100%;background:var(--royal);}
  .pm-bar-fill.done{background:var(--green);}
  .pm-val{width:36px;text-align:right;font-family:'IBM Plex Mono',monospace;flex-shrink:0;font-size:10px;}
  .no-goal{font-size:11px;color:var(--ink-faint);margin-top:12px;}
  .add-blog-card{display:flex;align-items:center;justify-content:center;border:1.5px dashed var(--line);border-radius:var(--radius);color:var(--ink-soft);font-size:13px;font-weight:600;cursor:pointer;min-height:110px;}
  .add-blog-card:hover{border-color:var(--royal);color:var(--royal);}

  .overall-goals{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .overall-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:20px;}
  .overall-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .overall-title{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;color:var(--navy);}
  .overall-note{font-size:11px;color:var(--ink-faint);}
  @media (max-width:760px){ .overall-goals{grid-template-columns:1fr;} }

  .channel-list{display:flex;flex-direction:column;gap:10px;}
  .channel-card{background:var(--panel);border-radius:10px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;cursor:pointer;}
  .channel-card .cname{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:14px;}
  .channel-card .cnote{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .add-channel-btn,.edit-goal-btn{font-size:12px;color:var(--royal-dark);font-weight:600;cursor:pointer;}

  .detail-header{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap;}
  .back-btn{font-size:13px;color:var(--royal-dark);cursor:pointer;font-weight:600;white-space:nowrap;}
  .detail-title{font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:700;}
  .detail-sub{font-size:12px;color:var(--ink-soft);}

  .sub-tabs{display:flex;gap:0;margin-bottom:22px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .sub-tab{padding:10px 4px;margin-right:22px;font-size:14px;color:var(--ink-soft);cursor:pointer;border-bottom:2px solid transparent;font-weight:500;}
  .sub-tab.active{color:var(--royal-dark);border-bottom-color:var(--royal);}

  .page-title{font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:700;margin-bottom:4px;}
  .page-sub{font-size:13px;color:var(--ink-soft);margin-bottom:22px;}

  .summary-row{display:flex;gap:12px;margin-bottom:24px;flex-wrap:wrap;}
  .summary-card{flex:1;min-width:150px;background:var(--panel);border-radius:var(--radius);padding:16px 18px;}
  .summary-card .num{font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:700;color:var(--royal-dark);}
  .summary-card .label{font-size:12px;color:var(--ink-soft);margin-top:3px;}

  .toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap;}
  .status-filters{display:flex;gap:4px;background:var(--panel);border-radius:999px;padding:3px;flex-wrap:wrap;}
  .sf{padding:6px 14px;border-radius:999px;font-size:12px;cursor:pointer;color:var(--ink-soft);white-space:nowrap;}
  .sf.active{background:var(--royal);color:#fff;}
  .new-btn{background:var(--royal);color:#fff;border:none;padding:9px 18px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;}
  .new-btn:hover{background:var(--royal-dark);}

  .board{display:flex;flex-direction:column;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;}
  .row{display:flex;align-items:stretch;background:#fff;cursor:pointer;}
  .row:hover{background:#FAFBFE;}
  .stub{font-family:'IBM Plex Mono',monospace;width:80px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px dashed var(--line);padding:10px 4px;text-align:center;}
  .stub .d{font-size:19px;font-weight:500;line-height:1;color:var(--royal-dark);}
  .stub .u{font-size:10px;color:var(--ink-soft);margin-top:2px;}
  .stub.overdue .d{color:var(--brick);}
  .row-body{flex:1;padding:13px 16px;min-width:0;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .row-main .title{font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;}
  .row-main .meta{font-size:12px;color:var(--ink-soft);margin-top:3px;}
  .row-right{display:flex;align-items:center;gap:10px;}
  .pill{font-size:11px;padding:3px 10px;border-radius:999px;font-weight:600;white-space:nowrap;}
  .pill.아이디어{background:var(--panel);color:var(--ink-soft);}
  .pill.작성중{background:var(--amber-soft);color:var(--amber);}
  .pill.발행완료{background:var(--green-soft);color:var(--green);}
  .pill.중복{background:var(--brick-soft);color:var(--brick);}
  .kw-tag{font-size:11px;background:var(--royal-soft);color:var(--royal-dark);padding:3px 9px;border-radius:6px;}

  .empty{padding:60px 20px;text-align:center;color:var(--ink-soft);}
  .empty .big{font-family:'Space Grotesk',sans-serif;font-size:18px;color:var(--navy);margin-bottom:6px;font-weight:600;}

  .rev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;}
  .rev-card{background:var(--panel);border-radius:var(--radius);padding:16px;cursor:pointer;}
  .rev-card .month{font-size:12px;color:var(--ink-soft);}
  .rev-card .amt{font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;color:var(--royal-dark);margin-top:4px;}
  .rev-card .src{font-size:11px;color:var(--ink-faint);margin-top:6px;}

  .goal-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:26px;}
  .goal-card{background:var(--panel);border-radius:var(--radius);padding:16px;}
  .goal-card .gname{font-size:12px;color:var(--ink-soft);font-weight:600;}
  .goal-card .gnums{display:flex;justify-content:space-between;align-items:baseline;margin-top:8px;}
  .goal-card .gactual{font-family:'Space Grotesk',sans-serif;font-size:21px;font-weight:700;color:var(--royal-dark);}
  .goal-card .gtarget{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-faint);}
  .goal-bar-bg{height:6px;border-radius:4px;background:#fff;margin-top:9px;overflow:hidden;}
  .goal-bar-fill{height:100%;background:var(--royal);}
  .goal-bar-fill.done{background:var(--green);}
  .goal-pct{font-size:11px;color:var(--ink-soft);margin-top:5px;}

  .month-picker{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  .month-picker input{padding:7px 10px;border:1px solid var(--line);border-radius:8px;font-family:'Inter',sans-serif;font-size:13px;}

  .trend-title{font-size:13px;font-weight:600;color:var(--navy);margin-bottom:10px;}
  .trend-chart{display:flex;align-items:flex-end;gap:18px;height:150px;padding:14px 10px;background:var(--panel);border-radius:var(--radius);overflow-x:auto;}
  .trend-col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;flex-shrink:0;height:100%;}
  .trend-bars{display:flex;gap:3px;align-items:flex-end;height:104px;}
  .trend-bar{width:11px;border-radius:3px 3px 0 0;}
  .trend-bar.target{background:var(--line);}
  .trend-bar.actual{background:var(--royal);}
  .trend-month{font-size:10px;color:var(--ink-soft);margin-top:8px;font-family:'IBM Plex Mono',monospace;}
  .legend{display:flex;gap:16px;margin-top:10px;font-size:11px;color:var(--ink-soft);}
  .legend span{display:flex;align-items:center;gap:5px;}
  .legend i{width:9px;height:9px;border-radius:2px;display:inline-block;}

  .rank-row{display:flex;align-items:center;gap:14px;padding:14px 18px;background:#fff;}
  .rank-num{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;color:var(--ink-faint);width:30px;flex-shrink:0;}
  .rank-row:nth-child(1) .rank-num{color:var(--royal);}
  .rank-info{flex:1;min-width:0;}
  .rank-info .rname{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;}
  .rank-info .rplat{font-size:11px;color:var(--ink-soft);}
  .rank-val{font-family:'IBM Plex Mono',monospace;font-size:15px;color:var(--royal-dark);font-weight:500;}

  .kw-group{background:#fff;border-radius:var(--radius);padding:14px 18px;margin-bottom:1px;}
  .kw-head{display:flex;align-items:center;gap:10px;margin-bottom:6px;}
  .kw-head .kwname{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;}
  .kw-blogs{font-size:12px;color:var(--ink-soft);}

  .note-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;cursor:pointer;}
  .note-card .nc-top{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .note-card .nc-title{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:15px;}
  .note-card .nc-meta{font-size:11px;color:var(--ink-soft);}
  .note-card .nc-body{font-size:13px;color:var(--ink-soft);margin-top:8px;white-space:pre-wrap;}
  .note-list{display:flex;flex-direction:column;gap:10px;}
  .warn-box{background:var(--amber-soft);color:var(--amber);border-radius:10px;padding:12px 16px;font-size:12.5px;margin-bottom:18px;}

  .overlay{position:fixed;inset:0;background:rgba(11,28,61,0.35);display:flex;align-items:center;justify-content:center;padding:20px;z-index:30;}
  .modal{background:#fff;border-radius:16px;width:100%;max-width:460px;padding:28px;border:1px solid var(--line);max-height:90vh;overflow-y:auto;}
  .modal h2{font-family:'Space Grotesk',sans-serif;font-size:19px;margin:0 0 18px;font-weight:600;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;font-weight:500;}
  .field input,.field select,.field textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-family:'Inter',sans-serif;font-size:14px;background:#fff;color:var(--navy);}
  .field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--royal);}
  .field textarea{resize:vertical;min-height:54px;}
  .field-row{display:flex;gap:10px;}
  .field-row .field{flex:1;}
  .modal-actions{display:flex;justify-content:space-between;margin-top:20px;gap:10px;}
  .btn{padding:9px 16px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--navy);font-family:'Inter',sans-serif;}
  .btn.primary{background:var(--royal);color:#fff;border:none;}
  .btn.primary:hover{background:var(--royal-dark);}
  .btn.danger{color:var(--brick);border-color:var(--brick-soft);}
  .side-actions{display:flex;gap:8px;}

  /* ---------- STUDIO (cover generator) ---------- */
  .studio-shell{display:flex;height:calc(100vh - 53px);}
  .studio-pages{width:104px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);padding:14px 10px;overflow-y:auto;}
  .studio-page-thumb{width:100%;aspect-ratio:4/5;border-radius:8px;border:2px solid transparent;margin-bottom:5px;cursor:pointer;overflow:hidden;position:relative;}
  .studio-page-thumb.selected{border-color:var(--royal);}
  .studio-page-label{font-size:10px;color:var(--ink-soft);text-align:center;margin-bottom:6px;cursor:pointer;}
  .studio-page-del{position:absolute;top:2px;right:2px;width:16px;height:16px;background:rgba(0,0,0,0.5);color:#fff;border-radius:4px;font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .studio-page-add{width:100%;aspect-ratio:4/5;border:1.5px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft);font-size:20px;margin-bottom:14px;background:#fff;}
  .studio-page-add:hover{border-color:var(--navy);color:var(--navy);}
  .studio-canvas-area{flex:1;display:flex;align-items:center;justify-content:center;background:#EEF0F6;overflow:auto;padding:30px;}
  .studio-canvas{position:relative;background:#0B1C3D;box-shadow:0 8px 30px rgba(11,28,61,0.18);overflow:hidden;}
  .studio-canvas.insta{width:400px;height:500px;}
  .studio-canvas.magazine{width:460px;height:650px;}
  .studio-canvas img.bg-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
  .studio-canvas .bg-overlay{position:absolute;inset:0;background:#000;pointer-events:none;}
  .studio-layer{position:absolute;transform:translate(-50%,-50%);cursor:move;padding:4px 6px;white-space:pre-wrap;user-select:none;}
  .studio-layer.selected{outline:1.5px dashed #fff;}
  .studio-layer img{display:block;pointer-events:none;}
  .studio-panel{width:300px;flex-shrink:0;background:#fff;border-left:1px solid var(--line);padding:18px 18px 40px;overflow-y:auto;}
  .studio-format-tabs{display:flex;gap:6px;margin-bottom:20px;}
  .studio-format-tabs .sf{flex:1;text-align:center;}
  .studio-section{margin-bottom:22px;}
  .studio-section-title{font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px;}
  .studio-btn-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
  .studio-chip{padding:6px 12px;border-radius:8px;font-size:12px;border:1px solid var(--line);cursor:pointer;color:var(--ink-soft);background:#fff;}
  .studio-chip.active{background:var(--royal);color:#fff;border-color:var(--royal);}
  .studio-upload{display:block;width:100%;padding:10px;border:1.5px dashed var(--line);border-radius:8px;text-align:center;font-size:12px;color:var(--ink-soft);cursor:pointer;}
  .studio-layer-list{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;}
  .studio-layer-item{padding:8px 10px;border-radius:7px;font-size:12.5px;color:var(--ink-soft);cursor:pointer;display:flex;justify-content:space-between;align-items:center;background:var(--panel);}
  .studio-layer-item.selected{background:var(--royal-soft);color:var(--royal-dark);font-weight:600;}
  .studio-layer-item .del-x{color:var(--brick);font-weight:700;cursor:pointer;padding:0 4px;}
  .studio-mini-label{font-size:11px;color:var(--ink-soft);margin:8px 0 4px;font-weight:500;}
  .studio-slider-row{display:flex;align-items:center;gap:8px;}
  .studio-slider-row input[type=range]{flex:1;}
  .studio-num{width:38px;text-align:right;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--ink-soft);}
  .studio-xy{display:flex;gap:8px;}
  .studio-xy input{width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:12px;}
  .studio-action-btn{width:100%;background:var(--royal);color:#fff;border:none;padding:10px;border-radius:8px;font-weight:600;font-size:13px;cursor:pointer;margin-bottom:10px;font-family:'Inter',sans-serif;}
  .studio-action-btn:hover{background:var(--royal-dark);}
  .studio-download-btn{width:100%;background:var(--royal);color:#fff;border:none;padding:12px;border-radius:10px;font-weight:600;font-size:13px;cursor:pointer;margin-top:6px;}
  .studio-download-btn:hover{background:var(--royal-dark);}
  .studio-download-btn.secondary{background:#fff;color:var(--navy);border:1px solid var(--line);margin-top:8px;}

async function loadKey(key, fallback){
  try{ const r=await window.storage.get(key,false); return r?JSON.parse(r.value):fallback; }catch(e){ return fallback; }
}
async function saveKey(key, val){ try{ await window.storage.set(key, JSON.stringify(val), false); }catch(e){ console.error(e); } }

function getGoal(blogId, month){ return goals.find(g=>g.blogId===blogId && g.month===month); }
function getYearGoal(year){ return yearGoals.find(y=>y.year===year); }
function actualRevenue(blogId, month){ return revenues.filter(r=>r.blogId===blogId && r.month===month).reduce((s,r)=>s+Number(r.amount||0),0); }

function computeYearActual(year){
  const visitors = goals.filter(g=>g.month && g.month.startsWith(year)).reduce((s,g)=>s+Number(g.actualVisitors||0),0);
  const postsCount = goals.filter(g=>g.month && g.month.startsWith(year)).reduce((s,g)=>s+Number(g.actualPosts||0),0);
  const revenue = revenues.filter(r=>r.month && r.month.startsWith(year)).reduce((s,r)=>s+Number(r.amount||0),0);
  return {visitors, posts: postsCount, revenue};
}
function computeMonthAggregate(month){
  const monthGoals = goals.filter(g=>g.month===month);
  const targetVisitors = monthGoals.reduce((s,g)=>s+Number(g.targetVisitors||0),0);
  const actualVisitors = monthGoals.reduce((s,g)=>s+Number(g.actualVisitors||0),0);
  const targetPosts = monthGoals.reduce((s,g)=>s+Number(g.targetPosts||0),0);
  const actualPostsCount = monthGoals.reduce((s,g)=>s+Number(g.actualPosts||0),0);
  const targetRevenue = monthGoals.reduce((s,g)=>s+Number(g.targetRevenue||0),0);
  const actualRevenueSum = revenues.filter(r=>r.month===month).reduce((s,r)=>s+Number(r.amount||0),0);
  return {targetVisitors, actualVisitors, targetPosts, actualPosts: actualPostsCount, targetRevenue, actualRevenue: actualRevenueSum};
}

const BJ_LOG_KEY='bj_log', BJ_MONTHLY_KEY='bj_monthly', BJ_FUTURE_KEY='bj_future', BJ_COLL_KEY='bj_collections';
const BJ_CATS={
  naver:{label:'네이버', color:'var(--green)', publish:true},
  adsense:{label:'애드센스', color:'var(--amber)', publish:true},
  video:{label:'영상·SNS', color:'var(--royal)', publish:true},
  task:{label:'할 일', color:'var(--ink-soft)', publish:false}
};
const BJ_PUBLISH_CATS=['naver','adsense','video'];
const BJ_SIGS={ task:'•', done:'×', migrated:'&gt;', cancel:'•', note:'–', event:'○', idea:'!' };
const BJ_REV_SOURCES=['애드포스트','체험단','협찬','원고료','기타'];
const BJ_DEFAULT_COLLS=['네이버 글감','체험단·협찬 마감','키워드 모음'];
const BJ_DOW=['일','월','화','수','목','금','토'];
const BJ_PAGES=['today','monthly','future','review','coll'];

let bjLog=[], bjMonthly=[], bjFuture=[], bjCollections=[];
let bjInputCat='naver', bjDraft='', bjCollId=null, bjArchiveOpen=false, bjFocusSel=null;

function ymd(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function bjToday(){ return ymd(new Date()); }
function bjAddDays(ds,n){ const [y,m,d]=ds.split('-').map(Number); return ymd(new Date(y,m-1,d+n)); }
function bjAddMonths(ms,n){ const [y,m]=ms.split('-').map(Number); const dt=new Date(y,m-1+n,1); return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0'); }
function bjDayLabel(ds){ const [y,m,d]=ds.split('-').map(Number); return `${m}월 ${d}일 (${BJ_DOW[new Date(y,m-1,d).getDay()]})`; }
function bjMonthLabel(ms){ const [y,m]=ms.split('-').map(Number); return `${y}년 ${m}월`; }
let bjDay=bjToday(), bjMonth=bjDay.slice(0,7), bjReviewMonth=bjMonth;

function bjSave(){ saveKey(BJ_LOG_KEY,bjLog); }
function bjParse(raw){
  let text=(raw||'').trim(), pri=false, sig='task';
  if(text.startsWith('*')){ pri=true; text=text.slice(1).trim(); }
  if(text.startsWith('!')){ sig='idea'; text=text.slice(1).trim(); }
  else if(/^[-–]\s/.test(text)){ sig='note'; text=text.slice(1).trim(); }
  else if(/^(o|○)\s/i.test(text)){ sig='event'; text=text.replace(/^(o|○)\s/i,'').trim(); }
  return {text, sig, pri};
}
function bjAdd(date, raw, cat){
  const p=bjParse(raw); if(!p.text) return false;
  bjLog.push({id:uid('bj'), date, text:p.text, sig:p.sig, pri:p.pri, cat:cat||'task', createdAt:Date.now()});
  bjSave(); return true;
}
function bjEntries(date){ return bjLog.filter(e=>e.date===date).sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)); }
function bjIsPublish(e){ return e.sig==='done' && BJ_CATS[e.cat] && BJ_CATS[e.cat].publish; }
function bjPublishCount(prefix, cat){ return bjLog.filter(e=>e.date.length===10 && e.date.startsWith(prefix) && bjIsPublish(e) && (!cat || e.cat===cat)).length; }
function bjMigrateTo(e, target){
  bjLog.push({id:uid('bj'), date:target, text:e.text, sig:'task', pri:e.pri, cat:e.cat, createdAt:Date.now(), from:e.date});
  e.sig='migrated';
}
function bjMigrate(e){ bjMigrateTo(e, e.date.length===10 ? bjAddDays(e.date,1) : bjAddMonths(e.date,1)); }
function bjMonthRec(month, create){
  let r=bjMonthly.find(x=>x.month===month);
  if(!r){ r={month, targetPosts:0, visitors:0, revenue:{}}; if(create) bjMonthly.push(r); }
  if(!r.revenue) r.revenue={};
  return r;
}
function bjRevenueTotal(r){ return Object.values(r.revenue||{}).reduce((s,v)=>s+Number(v||0),0); }

function bjEntryRow(e){
  const cat=BJ_CATS[e.cat]||BJ_CATS.task;
  const toggleable=['task','done','cancel'].includes(e.sig);
  const monthly=e.date.length===7;
  return `<div class="bj-row sig-${e.sig}">
    <span class="bj-pri">${e.pri?'*':''}</span>
    ${toggleable ? `<button class="bj-sig" data-bjtoggle="${e.id}" title="${e.sig==='done'?'완료 취소':'완료로 체크'}">${BJ_SIGS[e.sig]}</button>` : `<span class="bj-sig bj-sig-static">${BJ_SIGS[e.sig]}</span>`}
    <span class="bj-text">${escapeHtml(e.text)}${e.from?`<span class="bj-from">${e.from.length===10?Number(e.from.slice(5,7))+'/'+Number(e.from.slice(8)):Number(e.from.slice(5))+'월'}에서 옮김</span>`:''}</span>
    ${e.cat!=='task'?`<span class="bj-cat" style="--c:${cat.color}">${cat.label}</span>`:''}
    <span class="bj-actions">
      ${e.sig==='task'?`<button data-bjmigrate="${e.id}" title="${monthly?'다음 달로':'내일로'} 옮기기">&gt;</button><button data-bjcancel="${e.id}" title="안 하기로 함">–</button>`:''}
      <button data-bjpri="${e.id}" title="우선순위 표시">*</button>
      <button data-bjdel="${e.id}" title="삭제">×</button>
    </span>
  </div>`;
}

function bjHabitGrid(dates){
  const today=bjToday();
  return `<div class="bj-habit">
    <div class="bj-habit-row"><div class="bj-habit-label"></div>${dates.map(ds=>`<div class="bj-habit-num ${ds===today?'is-today':''}">${Number(ds.slice(8))}</div>`).join('')}</div>
    ${BJ_PUBLISH_CATS.map(c=>`<div class="bj-habit-row"><div class="bj-habit-label">${BJ_CATS[c].label}</div>${dates.map(ds=>{
      const n=bjLog.filter(e=>e.date===ds && e.cat===c && bjIsPublish(e)).length;
      const cls=['bj-dot']; if(n>0) cls.push('on'); if(ds>today) cls.push('future'); if(ds===today) cls.push('today');
      return `<div class="${cls.join(' ')}" style="--c:${BJ_CATS[c].color}" title="${ds} · ${n}개">${n>1?n:''}</div>`;
    }).join('')}</div>`).join('')}
  </div>`;
}

function bjHead(title, sub, navAttr, isNow, nowLabel){
  return `<div class="bj-head">
    <div><div class="page-title">${title}</div><div class="page-sub" style="margin-bottom:0;">${sub}</div></div>
    <div class="status-filters"><div class="sf" ${navAttr}="-1">‹</div><div class="sf ${isNow?'active':''}" ${navAttr}="now">${nowLabel}</div><div class="sf" ${navAttr}="1">›</div></div>
  </div>`;
}

function renderBJToday(){
  const today=bjToday();
  const entries=bjEntries(bjDay);
  const leftovers = bjDay===today ? bjLog.filter(e=>e.date.length===10 && e.date<today && e.sig==='task') : [];
  const month=bjDay.slice(0,7);
  const rec=bjMonthRec(month,false);
  const naverCount=bjPublishCount(month,'naver');
  const week=[]; for(let i=-6;i<=0;i++) week.push(bjAddDays(bjDay,i));
  const openCount=entries.filter(e=>e.sig==='task').length;
  const doneCount=entries.filter(e=>e.sig==='done').length;
  const pct = rec.targetPosts ? Math.min(100, Math.round(naverCount/rec.targetPosts*100)) : 0;
  return `
    ${bjHead(bjDay===today?'오늘':'데일리 로그', bjDayLabel(bjDay), 'data-bjday', bjDay===today, '오늘')}
    <div class="bj-layout">
      <div class="bj-main">
        ${leftovers.length?`<div class="bj-banner"><span>지난 날 못 끝낸 할 일이 ${leftovers.length}개 있어요</span><button id="bjPullBtn">오늘로 옮기기 &gt;</button></div>`:''}
        <div class="bj-paper">
          <div class="bj-cats">${Object.entries(BJ_CATS).map(([k,c])=>`<div class="bj-chip ${bjInputCat===k?'active':''}" data-bjcat="${k}" style="--c:${c.color}">${c.publish?c.label+' 발행':c.label}</div>`).join('')}</div>
          <div class="bj-input-wrap"><span class="bj-sig bj-sig-static">•</span><input id="bjInput" class="bj-input" value="${escapeHtml(bjDraft)}" placeholder="한 줄 적고 Enter" autocomplete="off"><button class="new-btn" id="bjAddBtn" style="padding:6px 14px;">추가</button></div>
          <div class="bj-hint">앞에 * 우선 · ! 아이디어 · - 메모 · o 일정 &nbsp;|&nbsp; • 누르면 × 완료</div>
          <div class="bj-list">${entries.length?entries.map(bjEntryRow).join(''):`<div class="bj-empty">아직 비어 있어요. 오늘 쓸 글부터 한 줄 적어보세요.</div>`}</div>
        </div>
      </div>
      <div class="bj-side">
        <div class="bj-card"><div class="bj-card-title">${bjDay===today?'오늘':'이날'} 체크</div><div class="bj-big">${doneCount}<span class="bj-big-sub"> / ${doneCount+openCount} 완료</span></div></div>
        <div class="bj-card"><div class="bj-card-title">${Number(month.slice(5))}월 네이버 발행</div><div class="bj-big">${naverCount}<span class="bj-big-sub"> / 목표 ${rec.targetPosts||'—'}</span></div>
          ${rec.targetPosts?`<div class="goal-bar-bg"><div class="goal-bar-fill ${pct>=100?'done':''}" style="width:${pct}%"></div></div>`:`<div class="bj-card-note">목표는 먼슬리에서 정해요</div>`}</div>
        <div class="bj-card"><div class="bj-card-title">최근 7일 발행</div>${bjHabitGrid(week)}</div>
      </div>
    </div>`;
}

function renderBJMonthly(){
  const today=bjToday();
  const [y,m]=bjMonth.split('-').map(Number);
  const days=new Date(y,m,0).getDate();
  const dates=[]; for(let d=1; d<=days; d++) dates.push(bjMonth+'-'+String(d).padStart(2,'0'));
  const rec=bjMonthRec(bjMonth,false);
  const naverCount=bjPublishCount(bjMonth,'naver');
  const monthTasks=bjEntries(bjMonth);
  const futureItems=bjFuture.filter(f=>f.month===bjMonth);
  const rev=bjRevenueTotal(rec);
  return `
    ${bjHead('먼슬리 로그', bjMonthLabel(bjMonth), 'data-bjmonth', bjMonth===today.slice(0,7), '이번 달')}
    <div class="summary-row">
      <div class="summary-card"><div class="num">${naverCount}<span class="bj-big-sub"> / <input class="bj-inline-num" data-bjrec="targetPosts" type="number" min="0" value="${rec.targetPosts||''}" placeholder="목표"></span></div><div class="label">네이버 발행 · 완료 체크로 자동 집계</div></div>
      <div class="summary-card"><input class="bj-num" data-bjrec="visitors" type="number" min="0" value="${rec.visitors||''}" placeholder="0"><div class="label">네이버 방문자 · 직접 입력</div></div>
      <div class="summary-card"><div class="num">${rev.toLocaleString()}원</div><div class="label">네이버 수익 합계</div></div>
    </div>
    <div class="bj-layout">
      <div class="bj-main" style="flex:1.1;">
        <div class="bj-paper bj-cal">
          ${dates.map(ds=>{
            const dow=new Date(y,m-1,Number(ds.slice(8))).getDay();
            const dayEntries=bjLog.filter(e=>e.date===ds);
            const events=dayEntries.filter(e=>e.sig==='event').map(e=>escapeHtml(e.text));
            const marks=BJ_PUBLISH_CATS.map(c=>{ const n=dayEntries.filter(e=>e.cat===c && bjIsPublish(e)).length; return n?`<i class="bj-mini-dot" style="--c:${BJ_CATS[c].color}" title="${BJ_CATS[c].label} ${n}개"></i>`:''; }).join('');
            return `<div class="bj-cal-row ${dow===0||dow===6?'weekend':''} ${ds===today?'is-today':''}" data-bjgoday="${ds}"><span class="bj-cal-d">${Number(ds.slice(8))}</span><span class="bj-cal-w">${BJ_DOW[dow]}</span><span class="bj-cal-marks">${marks}</span><span class="bj-cal-events">${events.join(' · ')}</span></div>`;
          }).join('')}
        </div>
        <div class="bj-card-note" style="margin-top:8px;">날짜를 누르면 그날 로그로 가요 · 점은 발행 완료, 글자는 ○ 일정</div>
      </div>
      <div class="bj-side">
        <div class="bj-paper">
          <div class="bj-card-title">이번 달 할 일</div>
          <div class="bj-input-wrap"><span class="bj-sig bj-sig-static">•</span><input id="bjMonthInput" class="bj-input" placeholder="이번 달 안에 할 일 적고 Enter" autocomplete="off"></div>
          <div class="bj-list" style="margin-top:8px;">${monthTasks.length?monthTasks.map(bjEntryRow).join(''):`<div class="bj-empty">아직 없어요</div>`}</div>
          ${futureItems.length?`<div class="bj-card-title" style="margin-top:14px;">퓨처 로그에서 온 일</div>${futureItems.map(f=>`<div class="bj-row"><span class="bj-pri"></span><span class="bj-sig bj-sig-static">&lt;</span><span class="bj-text">${escapeHtml(f.text)}</span><button class="bj-small-btn" data-bjfuturepull="${f.id}">할 일로</button></div>`).join('')}`:''}
        </div>
        <div class="bj-card">
          <div class="bj-card-title">네이버 수익 (원)</div>
          ${BJ_REV_SOURCES.map(s=>`<div class="bj-rev-row"><span>${s}</span><input type="number" min="0" data-bjrev="${s}" value="${rec.revenue[s]||''}" placeholder="0"></div>`).join('')}
        </div>
      </div>
    </div>
    <div class="hub-section" style="margin-top:26px;">
      <div class="hub-section-title">해빗 트래커 <span style="font-weight:400;color:var(--ink-faint);text-transform:none;letter-spacing:normal;">· 발행 완료 체크로 자동 표시</span></div>
      <div class="bj-card">${bjHabitGrid(dates)}</div>
    </div>`;
}

// ---- 퓨처 로그 ----
function renderBJFuture(){
  const start=bjToday().slice(0,7);
  const months=[]; for(let i=0;i<6;i++) months.push(bjAddMonths(start,i));
  return `
    <div class="page-title">퓨처 로그</div>
    <div class="page-sub">앞으로 6개월 동안 미리 챙길 일정·시즌 글감·마감을 적어두세요. 그 달이 되면 먼슬리에 나타나요.</div>
    <div class="bj-future">${months.map(ms=>{
      const items=bjFuture.filter(f=>f.month===ms);
      const seasons=seasonNotes.filter(s=>s.monthNum===Number(ms.slice(5)));
      return `<div class="bj-fbox">
        <h3>${Number(ms.slice(5))}월 <span class="bj-fyear">${ms.slice(0,4)}</span></h3>
        ${items.map(f=>`<div class="bj-row"><span class="bj-sig bj-sig-static">•</span><span class="bj-text">${escapeHtml(f.text)}</span><span class="bj-actions"><button data-bjfuturedel="${f.id}" title="삭제">×</button></span></div>`).join('')}
        ${seasons.map(s=>`<div class="bj-row sig-note"><span class="bj-sig bj-sig-static">–</span><span class="bj-text">${escapeHtml(s.note)}<span class="bj-from">시즌 메모</span></span></div>`).join('')}
        <input class="bj-line-input" data-bjfutureadd="${ms}" placeholder="+ 적고 Enter" autocomplete="off">
      </div>`;
    }).join('')}</div>`;
}

// ---- 월말 정리 (마이그레이션 + 회고) ----
function renderBJReview(){
  const ms=bjReviewMonth;
  const open=bjLog.filter(e=>e.sig==='task' && (e.date===ms || (e.date.length===10 && e.date.startsWith(ms)))).sort((a,b)=>a.date.localeCompare(b.date));
  const r=retroNotes.find(x=>x.month===ms)||{good:'',bad:'',next:''};
  const next=bjAddMonths(ms,1);
  return `
    ${bjHead('월말 정리', bjMonthLabel(ms)+' · 남은 일을 옮기거나 버리고, 한 달을 돌아봐요', 'data-bjrmonth', ms===bjToday().slice(0,7), '이번 달')}
    <div class="summary-row">${BJ_PUBLISH_CATS.map(c=>`<div class="summary-card"><div class="num">${bjPublishCount(ms,c)}</div><div class="label">${BJ_CATS[c].label} 발행</div></div>`).join('')}</div>
    <div class="hub-section">
      <div class="hub-section-title">남은 할 일 ${open.length}개</div>
      <div class="bj-card-note" style="margin:-4px 0 12px;">"그래도 할 가치가 있나?"를 묻고, 있으면 ${Number(next.slice(5))}월로 옮기고 아니면 버려요.</div>
      <div class="bj-paper">
        ${open.length===0?`<div class="bj-empty">깔끔해요. 남은 할 일이 없어요.</div>`:`
        <div class="bj-list">${open.map(e=>`<div class="bj-row">
          <span class="bj-pri">${e.pri?'*':''}</span><span class="bj-sig bj-sig-static">•</span>
          <span class="bj-text">${escapeHtml(e.text)}<span class="bj-from">${e.date.length===10?Number(e.date.slice(5,7))+'/'+Number(e.date.slice(8)):'먼슬리'}</span></span>
          ${e.cat!=='task'?`<span class="bj-cat" style="--c:${BJ_CATS[e.cat].color}">${BJ_CATS[e.cat].label}</span>`:''}
          <button class="bj-small-btn" data-bjnext="${e.id}">&gt; ${Number(next.slice(5))}월로</button>
          <button class="bj-small-btn ghost" data-bjdrop="${e.id}">– 버리기</button>
        </div>`).join('')}</div>
        <div style="text-align:right;margin-top:10px;"><button class="bj-small-btn" id="bjAllNext">모두 ${Number(next.slice(5))}월로 옮기기</button></div>`}
      </div>
    </div>
    <div class="hub-section">
      <div class="hub-section-title">한 달 돌아보기 <span style="font-weight:400;color:var(--ink-faint);text-transform:none;letter-spacing:normal;">· 적고 다른 곳을 누르면 저장돼요</span></div>
      <div class="bj-review-grid">
        <div class="field"><label>잘된 것</label><textarea data-bjretro="good" placeholder="반응 좋았던 글, 지킨 루틴">${escapeHtml(r.good||'')}</textarea></div>
        <div class="field"><label>아쉬운 것</label><textarea data-bjretro="bad" placeholder="밀린 것, 빼도 되는 것">${escapeHtml(r.bad||'')}</textarea></div>
        <div class="field"><label>다음 달 딱 한 가지</label><textarea data-bjretro="next" placeholder="예: 네이버 주 5회 발행">${escapeHtml(r.next||'')}</textarea></div>
      </div>
    </div>`;
}

// ---- 컬렉션 ----
function renderBJColl(){
  const c=bjCollections.find(x=>x.id===bjCollId) || bjCollections[0];
  if(!c) return `<div class="empty"><div class="big">컬렉션이 없어요</div>왼쪽 "+ 새 컬렉션"으로 만들어보세요</div>`;
  bjCollId=c.id;
  const items=c.items.slice().sort((a,b)=>(a.done?1:0)-(b.done?1:0));
  return `
    <div class="bj-head">
      <div><div class="page-title">${escapeHtml(c.name)}</div><div class="page-sub" style="margin-bottom:0;">컬렉션 · ${c.items.filter(i=>!i.done).length}개 남음</div></div>
      <div style="display:flex;gap:14px;"><div class="edit-goal-btn" id="bjCollRename">이름 바꾸기</div><div class="edit-goal-btn" id="bjCollDelete" style="color:var(--brick);">삭제</div></div>
    </div>
    <div class="bj-paper" style="max-width:720px;">
      <div class="bj-input-wrap"><span class="bj-sig bj-sig-static">•</span><input id="bjCollInput" class="bj-input" placeholder="적고 Enter" autocomplete="off"></div>
      <div class="bj-list" style="margin-top:10px;">${items.length?items.map(i=>`<div class="bj-row ${i.done?'sig-done':''}">
        <span class="bj-pri"></span><button class="bj-sig" data-bjcolltoggle="${i.id}">${i.done?'×':'•'}</button>
        <span class="bj-text">${escapeHtml(i.text)}</span>
        <span class="bj-actions"><button data-bjcolldel="${i.id}" title="삭제">×</button></span>
      </div>`).join(''):`<div class="bj-empty">아직 비어 있어요</div>`}</div>
    </div>`;
}

// ---- 사이드바 보조 ----
function bindBJSidebar(){
  const t=document.getElementById('bjArchiveToggle'); if(t) t.onclick=()=>{ bjArchiveOpen=!bjArchiveOpen; render(); };
  const nc=document.getElementById('bjNewColl'); if(nc) nc.onclick=()=>{
    const name=(prompt('새 컬렉션 이름','')||'').trim(); if(!name) return;
    const c={id:uid('coll'), name, items:[]}; bjCollections.push(c); saveKey(BJ_COLL_KEY,bjCollections);
    bjCollId=c.id; page='coll'; render();
  };
  const ex=document.getElementById('bjExport'); if(ex) ex.onclick=()=>{
    const data={}; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k.startsWith('hye:')) data[k.slice(4)]=localStorage.getItem(k); }
    const blob=new Blob([JSON.stringify({app:'HYE-ritage', exportedAt:new Date().toISOString(), data})],{type:'application/json'});
    downloadBlobFile(blob, 'hye-ritage-backup-'+bjToday()+'.json');
  };
  const im=document.getElementById('bjImport'); if(im) im.onchange=(e)=>{
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader(); reader.onload=()=>{
      try{
        const parsed=JSON.parse(reader.result);
        if(!parsed || !parsed.data) throw new Error('bad');
        if(!confirm('백업을 불러오면 지금 이 브라우저의 기록을 덮어써요. 계속할까요?')) return;
        Object.entries(parsed.data).forEach(([k,v])=>localStorage.setItem('hye:'+k, v));
        location.reload();
      }catch(err){ alert('백업 파일을 읽지 못했어요'); }
    }; reader.readAsText(file);
  };
}

function bjFindEntry(id){ return bjLog.find(x=>x.id===id); }
function bindBJEvents(){
  const on=(sel, ev, fn)=>document.querySelectorAll(sel).forEach(el=>{ el[ev]=(e)=>fn(el,e); });

  // nav
  on('[data-bjday]','onclick',el=>{ const v=el.dataset.bjday; bjDay = v==='now'?bjToday():bjAddDays(bjDay,Number(v)); render(); });
  on('[data-bjmonth]','onclick',el=>{ const v=el.dataset.bjmonth; bjMonth = v==='now'?bjToday().slice(0,7):bjAddMonths(bjMonth,Number(v)); render(); });
  on('[data-bjrmonth]','onclick',el=>{ const v=el.dataset.bjrmonth; bjReviewMonth = v==='now'?bjToday().slice(0,7):bjAddMonths(bjReviewMonth,Number(v)); render(); });
  on('[data-bjgoday]','onclick',el=>{ bjDay=el.dataset.bjgoday; page='today'; render(); });

  // entry actions (today, monthly)
  on('[data-bjtoggle]','onclick',el=>{ const e=bjFindEntry(el.dataset.bjtoggle); if(!e) return; e.sig = e.sig==='task' ? 'done' : 'task'; bjSave(); render(); });
  on('[data-bjmigrate]','onclick',el=>{ const e=bjFindEntry(el.dataset.bjmigrate); if(!e) return; bjMigrate(e); bjSave(); render(); });
  on('[data-bjcancel]','onclick',el=>{ const e=bjFindEntry(el.dataset.bjcancel); if(!e) return; e.sig='cancel'; bjSave(); render(); });
  on('[data-bjpri]','onclick',el=>{ const e=bjFindEntry(el.dataset.bjpri); if(!e) return; e.pri=!e.pri; bjSave(); render(); });
  on('[data-bjdel]','onclick',el=>{ bjLog=bjLog.filter(x=>x.id!==el.dataset.bjdel); bjSave(); render(); });

  // today input
  on('[data-bjcat]','onclick',el=>{ bjInputCat=el.dataset.bjcat; bjFocusSel='#bjInput'; render(); });
  const input=document.getElementById('bjInput');
  if(input){
    input.oninput=()=>{ bjDraft=input.value; };
    const add=()=>{ if(bjAdd(bjDay, input.value, bjInputCat)){ bjDraft=''; bjFocusSel='#bjInput'; render(); } };
    input.onkeydown=(e)=>{ if(e.key==='Enter' && !e.isComposing) add(); };
    document.getElementById('bjAddBtn').onclick=add;
  }
  const pull=document.getElementById('bjPullBtn');
  if(pull) pull.onclick=()=>{ const today=bjToday(); bjLog.filter(e=>e.date.length===10 && e.date<today && e.sig==='task').forEach(e=>bjMigrateTo(e,today)); bjSave(); render(); };

  // monthly
  const mInput=document.getElementById('bjMonthInput');
  if(mInput) mInput.onkeydown=(e)=>{ if(e.key==='Enter' && !e.isComposing){ if(bjAdd(bjMonth, mInput.value, 'task')){ bjFocusSel='#bjMonthInput'; render(); } } };
  on('[data-bjrec]','onchange',el=>{ const r=bjMonthRec(bjMonth,true); r[el.dataset.bjrec]=Number(el.value)||0; saveKey(BJ_MONTHLY_KEY,bjMonthly); render(); });
  on('[data-bjrev]','onchange',el=>{ const r=bjMonthRec(bjMonth,true); r.revenue[el.dataset.bjrev]=Number(el.value)||0; saveKey(BJ_MONTHLY_KEY,bjMonthly); render(); });
  on('[data-bjfuturepull]','onclick',el=>{ const f=bjFuture.find(x=>x.id===el.dataset.bjfuturepull); if(!f) return; bjAdd(bjMonth, f.text, 'task'); bjFuture=bjFuture.filter(x=>x.id!==f.id); saveKey(BJ_FUTURE_KEY,bjFuture); render(); });

  // future
  on('[data-bjfutureadd]','onkeydown',(el,e)=>{ if(e.key!=='Enter' || e.isComposing) return; const text=el.value.trim(); if(!text) return; bjFuture.push({id:uid('fut'), month:el.dataset.bjfutureadd, text}); saveKey(BJ_FUTURE_KEY,bjFuture); bjFocusSel=`[data-bjfutureadd="${el.dataset.bjfutureadd}"]`; render(); });
  on('[data-bjfuturedel]','onclick',el=>{ bjFuture=bjFuture.filter(x=>x.id!==el.dataset.bjfuturedel); saveKey(BJ_FUTURE_KEY,bjFuture); render(); });

  // review
  on('[data-bjnext]','onclick',el=>{ const e=bjFindEntry(el.dataset.bjnext); if(!e) return; bjMigrateTo(e, bjAddMonths(bjReviewMonth,1)); bjSave(); render(); });
  on('[data-bjdrop]','onclick',el=>{ const e=bjFindEntry(el.dataset.bjdrop); if(!e) return; e.sig='cancel'; bjSave(); render(); });
  const allNext=document.getElementById('bjAllNext');
  if(allNext) allNext.onclick=()=>{ const ms=bjReviewMonth, nx=bjAddMonths(ms,1); bjLog.filter(e=>e.sig==='task' && (e.date===ms || (e.date.length===10 && e.date.startsWith(ms)))).forEach(e=>bjMigrateTo(e,nx)); bjSave(); render(); };
  on('[data-bjretro]','onblur',el=>{
    let r=retroNotes.find(x=>x.month===bjReviewMonth);
    if(!r){ r={id:uid('retro'), month:bjReviewMonth, good:'', bad:'', next:''}; retroNotes.push(r); }
    r[el.dataset.bjretro]=el.value.trim(); saveKey(RETRO_KEY,retroNotes);
  });

  // collections
  const coll=bjCollections.find(x=>x.id===bjCollId);
  const cInput=document.getElementById('bjCollInput');
  if(cInput && coll) cInput.onkeydown=(e)=>{ if(e.key!=='Enter' || e.isComposing) return; const text=cInput.value.trim(); if(!text) return; coll.items.push({id:uid('ci'), text, done:false}); saveKey(BJ_COLL_KEY,bjCollections); bjFocusSel='#bjCollInput'; render(); };
  on('[data-bjcolltoggle]','onclick',el=>{ const i=coll&&coll.items.find(x=>x.id===el.dataset.bjcolltoggle); if(!i) return; i.done=!i.done; saveKey(BJ_COLL_KEY,bjCollections); render(); });
  on('[data-bjcolldel]','onclick',el=>{ if(!coll) return; coll.items=coll.items.filter(x=>x.id!==el.dataset.bjcolldel); saveKey(BJ_COLL_KEY,bjCollections); render(); });
  const rn=document.getElementById('bjCollRename'); if(rn && coll) rn.onclick=()=>{ const name=(prompt('컬렉션 이름', coll.name)||'').trim(); if(!name) return; coll.name=name; saveKey(BJ_COLL_KEY,bjCollections); render(); };
  const dl=document.getElementById('bjCollDelete'); if(dl && coll) dl.onclick=()=>{ if(!confirm(`"${coll.name}" 컬렉션을 지울까요? 안의 항목도 함께 지워져요.`)) return; bjCollections=bjCollections.filter(x=>x.id!==coll.id); saveKey(BJ_COLL_KEY,bjCollections); bjCollId=null; page=bjCollections.length?'coll':'today'; render(); };

  if(bjFocusSel){ const el=document.querySelector(bjFocusSel); if(el){ el.focus(); const v=el.value; el.value=''; el.value=v; } bjFocusSel=null; }
}

// ================= WEEKLY PLAN =================
let weeklyPlanOffset=0; // 0=this week, -1=last week, 1=next week
function renderWeeklyPlan(){
  const base=new Date(); base.setDate(base.getDate()+weeklyPlanOffset*7);
  const day=base.getDay();
  const diffToMonday = day===0?-6:1-day;
  const monday=new Date(base); monday.setDate(base.getDate()+diffToMonday); monday.setHours(0,0,0,0);
  const sunday=new Date(monday); sunday.setDate(monday.getDate()+6); sunday.setHours(23,59,59,999);
  const rangeLabel = `${monday.getMonth()+1}/${monday.getDate()} ~ ${sunday.getMonth()+1}/${sunday.getDate()}`;

  const weekPosts = posts.filter(p=>p.date && new Date(p.date)>=monday && new Date(p.date)<=sunday);
  const totalCount = weekPosts.length;
  const doneCount = weekPosts.filter(p=>p.status==='발행완료').length;

  const activeBlogs = blogs.filter(b=>b.status==='활성');
  const otherBlogs = blogs.filter(b=>b.status!=='활성');

  const blogRow = (b)=>{
    const bPosts = weekPosts.filter(p=>p.blogId===b.id).sort((a,c)=>new Date(a.date)-new Date(c.date));
    const bDone = bPosts.filter(p=>p.status==='발행완료').length;
    return `
      <div class="row" data-weeklyblog="${b.id}">
        <div class="stub"><div class="d">${bPosts.length}</div><div class="u">개 예정</div></div>
        <div class="row-body">
          <div class="row-main">
            <div class="title">${escapeHtml(b.name)}</div>
            <div class="meta">${bPosts.length===0 ? '이번 주 예정 글 없음' : bPosts.map(p=>{
              const dt=new Date(p.date);
              return `${dt.getMonth()+1}/${dt.getDate()} ${escapeHtml(p.title)}`;
            }).join(' · ')}</div>
          </div>
          <div class="row-right">${bPosts.length>0 ? `<span class="pill ${bDone===bPosts.length?'발행완료':'작성중'}">${bDone}/${bPosts.length} 완료</span>` : ''}</div>
        </div>
      </div>
    `;
  };

  return `
    <div class="page-title">주간 작업 계획</div>
    <div class="page-sub">이번 주(월~일) 블로그별로 몇 개 글을 써야 하는지 한눈에 확인하세요</div>
    <div class="toolbar">
      <div class="status-filters">
        <div class="sf" data-weeknav="-1">‹ 지난주</div>
        <div class="sf active">${rangeLabel}</div>
        <div class="sf" data-weeknav="1">다음주 ›</div>
      </div>
      ${weeklyPlanOffset!==0 ? `<div class="edit-goal-btn" data-weeknav="reset">이번 주로</div>` : ''}
    </div>
    <div class="summary-row">
      <div class="summary-card"><div class="num">${totalCount}</div><div class="label">이번 주 전체 예정</div></div>
      <div class="summary-card"><div class="num">${doneCount}</div><div class="label">발행 완료</div></div>
      <div class="summary-card"><div class="num">${totalCount-doneCount}</div><div class="label">남은 글</div></div>
    </div>
    <div class="board">
      ${activeBlogs.map(blogRow).join('')}
      ${otherBlogs.length>0 ? otherBlogs.map(blogRow).join('') : ''}
    </div>

// ---- 월간 트렌드 차트 (최근 6개월, 자동 집계) ----
function renderTrendChart(){
  const months=[]; const now=new Date();
  for(let i=5;i>=0;i--){ const d=new Date(now.getFullYear(), now.getMonth()-i, 1); months.push(d.toISOString().slice(0,7)); }
  const data = months.map(m=>computeMonthAggregate(m));
  const maxVisitors=Math.max(1,...data.map(d=>d.actualVisitors));
  const maxRevenue=Math.max(1,...data.map(d=>d.actualRevenue));
  const maxPosts=Math.max(1,...data.map(d=>d.actualPosts));
  const w=560,h=180,padL=8,padB=20,padT=10,padR=8;
  const plotW=w-padL-padR, plotH=h-padT-padB;
  function pathFor(vals,max){
    return vals.map((v,i)=>{
      const x=padL + (months.length>1 ? (i/(months.length-1))*plotW : plotW/2);
      const y=padT + plotH - (v/max)*plotH;
      return (i===0?'M':'L')+x.toFixed(1)+','+y.toFixed(1);
    }).join(' ');
  }
  const visitorsPath=pathFor(data.map(d=>d.actualVisitors), maxVisitors);
  const revenuePath=pathFor(data.map(d=>d.actualRevenue), maxRevenue);
  const postsPath=pathFor(data.map(d=>d.actualPosts), maxPosts);
  const hasAny = data.some(d=>d.actualVisitors||d.actualRevenue||d.actualPosts);
  return `
    <div class="hub-section">
      <div class="hub-section-title">월간 트렌드 <span style="font-weight:400;color:var(--ink-faint);text-transform:none;letter-spacing:normal;">· 최근 6개월 · 블로그 전체 합산, 자동 집계</span></div>
      <div style="background:var(--panel);border-radius:var(--radius);padding:18px;">
        ${!hasAny ? `<div style="font-size:12px;color:var(--ink-faint);padding:20px 0;text-align:center;">아직 데이터가 없어요 — 각 블로그에 목표·수익을 기록하면 여기 그래프로 쌓여요</div>` : `
        <svg viewBox="0 0 ${w} ${h}" style="width:100%;max-width:560px;height:auto;display:block;">
          <path d="${visitorsPath}" fill="none" stroke="var(--royal)" stroke-width="2"/>
          <path d="${revenuePath}" fill="none" stroke="#E4572E" stroke-width="2"/>
          <path d="${postsPath}" fill="none" stroke="var(--green)" stroke-width="2"/>
          ${months.map((m,i)=>{
            const x=padL+(months.length>1 ? (i/(months.length-1))*plotW : plotW/2);
            return `<text x="${x}" y="${h-4}" font-size="9" fill="var(--ink-faint)" text-anchor="middle">${monthLabel(m)}</text>`;
          }).join('')}
        </svg>`}
        <div style="display:flex;gap:16px;margin-top:8px;font-size:11px;color:var(--ink-soft);flex-wrap:wrap;">
          <span style="display:flex;align-items:center;gap:5px;"><i style="width:10px;height:2px;background:var(--royal);display:inline-block;"></i>방문자</span>
          <span style="display:flex;align-items:center;gap:5px;"><i style="width:10px;height:2px;background:#E4572E;display:inline-block;"></i>수익</span>
          <span style="display:flex;align-items:center;gap:5px;"><i style="width:10px;height:2px;background:var(--green);display:inline-block;"></i>포스팅</span>
        </div>
      </div>
    </div>
  `;
}

// ---- 한 달 작업 트래커 (발행완료 기준 자동 계산) ----
function cellDateStr(monthStr, dayNum){ return monthStr+'-'+String(dayNum).padStart(2,'0'); }
function getBlogMonthlyTarget(blogId, monthStr){
  const g=getGoal(blogId, monthStr);
  return (g && g.targetPosts>0) ? g.targetPosts : DEFAULT_TRACKER_TARGET;
}
function blogTrackerPct(blogId, monthStr, dayNum){
  const target = getBlogMonthlyTarget(blogId, monthStr);
  const ds = cellDateStr(monthStr, dayNum);
  const prefix = monthStr+'-';
  const preciseCum = posts.filter(p=>p.blogId===blogId && p.status==='발행완료' && p.date && p.date.startsWith(prefix) && p.date<=ds).length;
  const quickCum = quickPublishLog.filter(q=>q.blogId===blogId && q.date && q.date.startsWith(prefix) && q.date<=ds).reduce((s,q)=>s+Number(q.count||0),0);
  const cum = preciseCum + quickCum;
  return Math.min(100, Math.round(cum/target*100));
}
function trackerBandColor(pct){
  if(pct<=0) return 'var(--trk-none)';
  if(pct<31) return 'var(--trk-low)';
  if(pct<70) return 'var(--trk-mid)';
  return 'var(--trk-high)';
}

      ${selected.length===0 ? `<div class="empty"><div class="big">선택된 블로그가 없어요</div>"추적할 블로그 선택"에서 골라보세요</div>` : `
      <div style="overflow-x:auto;padding-bottom:4px;">

          <div style="display:flex;gap:2px;margin-bottom:4px;margin-left:148px;">
            ${Array.from({length:daysInMo},(_,i)=>i+1).map(d=>`<div style="width:16px;flex-shrink:0;font-size:8px;color:${d===todayNum?'var(--royal)':'var(--ink-faint)'};text-align:center;font-weight:${d===todayNum?'700':'400'};">${d%5===0||d===1?d:''}</div>`).join('')}
          </div>

            <div style="display:flex;align-items:center;gap:2px;margin-bottom:2px;">

function renderGoal(b){
  const g = getGoal(b.id, goalMonth) || {targetVisitors:0,targetPosts:0,targetRevenue:0,actualVisitors:0,actualPosts:0};
  const aRev = actualRevenue(b.id, goalMonth);
  const months = last6Months();
  const maxVisitor = Math.max(1, ...months.map(m=>{ const gg=getGoal(b.id,m); return Math.max(gg?.targetVisitors||0, gg?.actualVisitors||0); }));
  return `
    <div class="month-picker"><input type="month" id="goalMonthPicker" value="${goalMonth}"><div class="edit-goal-btn" id="editGoalBtn">${monthLabel(goalMonth)} 목표 설정</div></div>

    <div class="trend-title">최근 6개월 방문자 추이 (연한 막대: 목표 · 진한 막대: 실제) — 막대를 누르면 그 달 수치를 직접 입력할 수 있어요</div>
    <div class="trend-chart">
      ${months.map(m=>{
        const gg=getGoal(b.id,m); const t=gg?.targetVisitors||0, a=gg?.actualVisitors||0;
        const th=Math.round(t/maxVisitor*100), ah=Math.round(a/maxVisitor*100);
        return `<div class="trend-col" data-month="${m}" style="cursor:pointer;"><div class="trend-bars"><div class="trend-bar target" style="height:${th}px"></div><div class="trend-bar actual" style="height:${ah}px"></div></div><div class="trend-month">${monthLabel(m)}</div></div>`;
      }).join('')}
    </div>
    <div class="legend"><span><i style="background:var(--line)"></i>목표</span><span><i style="background:var(--royal)"></i>실제</span></div>
    ${goalEditing ? renderGoalModal(b, g) : ''}
  `;
}

// ---- Dashboard ----
function daysInMonthCount(year, monthIndex){ return new Date(year, monthIndex+1, 0).getDate(); }
function renderBrandingCalendar(){
  const [y,m] = brandingCalMonth.split('-').map(Number);
  const monthIndex = m-1;
  const firstDow = new Date(y, monthIndex, 1).getDay();
  const totalDays = daysInMonthCount(y, monthIndex);
  const todayStr = new Date().toISOString().slice(0,10);
  const cellSize=48, gap=6;

  const dowRow = ['일','월','화','수','목','금','토'].map(d=>`<div style="width:${cellSize}px;text-align:center;font-size:10px;color:var(--ink-faint);flex-shrink:0;">${d}</div>`).join('');

  let dayNum=1;
  let rowsHtml='';
  for(let w=0; w<6 && dayNum<=totalDays; w++){
    let rowCells='';
    for(let dow=0; dow<7; dow++){
      const cellIndex = w*7+dow;
      if(cellIndex<firstDow || dayNum>totalDays){
        rowCells += `<div style="width:${cellSize}px;height:${cellSize}px;flex-shrink:0;"></div>`;
      } else {
        const d=dayNum;
        const dateStr = y+'-'+String(m).padStart(2,'0')+'-'+String(d).padStart(2,'0');
        const hasEvent = brandingSchedule.some(s=>s.date===dateStr);
        const isToday = dateStr===todayStr;
        const isSelected = dateStr===brandingCalSelectedDate;
        rowCells += `<div class="cal-cell ${isToday?'today':''} ${isSelected?'active':''}" data-caldate="${dateStr}" style="width:${cellSize}px;height:${cellSize}px;flex-shrink:0;"><span>${d}</span>${hasEvent?'<i class="cal-dot"></i>':''}</div>`;
        dayNum++;
      }
    }
    rowsHtml += `<div style="display:flex;gap:${gap}px;margin-bottom:${gap}px;">${rowCells}</div>`;
  }
  const totalWidth = cellSize*7 + gap*6 + 36;
  return `
    <div class="cal-wrap" style="width:${totalWidth}px;">
      <div class="cal-header">
        <div class="cal-nav" data-calnav="-1">‹</div>
        <div class="cal-title">${y}년 ${m}월</div>
        <div class="cal-nav" data-calnav="1">›</div>
      </div>
      <div style="display:flex;gap:${gap}px;margin-bottom:6px;">${dowRow}</div>
      ${rowsHtml}
    </div>
  `;
}

function computeWeekRangeOffset(offset){
  const base=new Date(); base.setDate(base.getDate()+offset*7);
  const day=base.getDay(); const diffToMonday=day===0?-6:1-day;
  const monday=new Date(base); monday.setDate(base.getDate()+diffToMonday); monday.setHours(0,0,0,0);
  const sunday=new Date(monday); sunday.setDate(monday.getDate()+6); sunday.setHours(23,59,59,999);
  return {monday, sunday};
}
function weekKeyFromMonday(monday){ return monday.toISOString().slice(0,10); }
function wChannelActual(channelId, monday, sunday){
  return brandingWPlanTasks.filter(t=>t.channelId===channelId && t.done && t.date && new Date(t.date)>=monday && new Date(t.date)<=sunday).length;
}

// ---- Branding events ----
function bindBrandingEvents(){
  document.querySelectorAll('[data-bpage]').forEach(el=>{ el.onclick=()=>{ brandingPage=el.dataset.bpage; render(); }; });

  const missionInput=document.getElementById('brandingMissionInput');
  if(missionInput) missionInput.onblur=(e)=>{ brandingMission=e.target.value.trim(); saveKey(BRANDING_MISSION_KEY,brandingMission); };

  // dashboard todos
  const addTodoBtn=document.getElementById('addTodoBtn'); if(addTodoBtn) addTodoBtn.onclick=()=>{ brandingTodoModalOpen=true; render(); };

  // dashboard calendar
  document.querySelectorAll('[data-calnav]').forEach(el=>{
    el.onclick=()=>{
      const [y,m]=brandingCalMonth.split('-').map(Number);
      const d=new Date(y, m-1+Number(el.dataset.calnav), 1);
      brandingCalMonth = d.toISOString().slice(0,7);
      render();
    };
  });
  document.querySelectorAll('[data-caldate]').forEach(el=>{ el.onclick=()=>{ brandingCalSelectedDate=el.dataset.caldate; render(); }; });
  const inlineSchedAddBtn=document.getElementById('inlineSchedAddBtn');
  const doAddSched=()=>{
    const input=document.getElementById('inlineSchedInput');
    const title=input.value.trim();
    if(!title) return;
    brandingSchedule.push({id:uid('sched'), date:brandingCalSelectedDate, title, done:false});
    saveKey(BRANDING_SCHEDULE_KEY,brandingSchedule); render();
  };
  if(inlineSchedAddBtn) inlineSchedAddBtn.onclick=doAddSched;
  const inlineSchedInput=document.getElementById('inlineSchedInput');
  if(inlineSchedInput) inlineSchedInput.onkeydown=(e)=>{ if(e.key==='Enter') doAddSched(); };
  document.querySelectorAll('[data-schedcheck]').forEach(el=>{ el.onchange=()=>{ const s=brandingSchedule.find(x=>x.id===el.dataset.schedcheck); if(s){ s.done=el.checked; saveKey(BRANDING_SCHEDULE_KEY,brandingSchedule); render(); } }; });
  document.querySelectorAll('[data-scheduledel]').forEach(el=>{ el.onclick=()=>{ brandingSchedule=brandingSchedule.filter(s=>s.id!==el.dataset.scheduledel); saveKey(BRANDING_SCHEDULE_KEY,brandingSchedule); render(); }; });
  document.querySelectorAll('[data-todocheck]').forEach(el=>{ el.onchange=()=>{ const t=brandingTodos.find(x=>x.id===el.dataset.todocheck); if(t){ t.done=el.checked; saveKey(BRANDING_TODOS_KEY,brandingTodos); render(); } }; });
  document.querySelectorAll('[data-tododel]').forEach(el=>{ el.onclick=()=>{ brandingTodos=brandingTodos.filter(t=>t.id!==el.dataset.tododel); saveKey(BRANDING_TODOS_KEY,brandingTodos); render(); }; });
  const todoOverlay=document.getElementById('brandingTodoOverlay');
  if(todoOverlay){
    todoOverlay.onclick=(e)=>{ if(e.target.id==='brandingTodoOverlay'){ brandingTodoModalOpen=false; render(); } };
    document.getElementById('bt-cancel').onclick=()=>{ brandingTodoModalOpen=false; render(); };
    document.getElementById('bt-save').onclick=()=>{
      const text=document.getElementById('bt-text').value.trim();
      if(!text){ alert('내용을 입력해주세요'); return; }
      const date=document.getElementById('bt-date').value || new Date().toISOString().slice(0,10);
      brandingTodos.push({id:uid('todo'), text, done:false, date});
      saveKey(BRANDING_TODOS_KEY,brandingTodos); brandingTodoModalOpen=false; render();
    };
  }

  // weekly plan
  document.querySelectorAll('[data-wpnav]').forEach(el=>{
    el.onclick=()=>{
      const v=el.dataset.wpnav;
      if(v==='reset'){ brandingWeeklyPlanOffset=0; } else { brandingWeeklyPlanOffset += Number(v); }
      render();
    };
  });

  // channel manage
  const manageChannelsBtn=document.getElementById('manageChannelsBtn'); if(manageChannelsBtn) manageChannelsBtn.onclick=()=>{ brandingChannelManageOpen=true; brandingChannelEditingId=null; render(); };
  const quickAddChannelBtn=document.getElementById('quickAddChannelBtn'); if(quickAddChannelBtn) quickAddChannelBtn.onclick=()=>{ brandingChannelManageOpen=true; brandingChannelEditingId=null; render(); };
  document.querySelectorAll('[data-openplanner]').forEach(el=>{ el.onclick=()=>{ brandingPlannerChannelId=el.dataset.openplanner; render(); }; });
  const chManageOverlay=document.getElementById('chManageOverlay');
  if(chManageOverlay){
    chManageOverlay.onclick=(e)=>{ if(e.target.id==='chManageOverlay'){ brandingChannelManageOpen=false; render(); } };
    document.getElementById('chmanage-close').onclick=()=>{ brandingChannelManageOpen=false; render(); };

  const newInputBtn=document.getElementById('newInputBtn'); if(newInputBtn) newInputBtn.onclick=()=>{ brandingInputEditingId='new'; render(); };
  document.querySelectorAll('[data-input]').forEach(el=>{ el.onclick=()=>{ brandingInputEditingId=el.dataset.input; render(); }; });
  let inputTypeSelected = null;
  document.querySelectorAll('[data-inputtype]').forEach(el=>{ el.onclick=()=>{
    document.querySelectorAll('[data-inputtype]').forEach(x=>x.classList.remove('active'));
    el.classList.add('active'); inputTypeSelected=el.dataset.inputtype;
  }; });
  const inputOverlay=document.getElementById('inputOverlay');
  if(inputOverlay){
    inputOverlay.onclick=(e)=>{ if(e.target.id==='inputOverlay'){ brandingInputEditingId=null; render(); } };
    document.getElementById('in-cancel').onclick=()=>{ brandingInputEditingId=null; render(); };
    const del=document.getElementById('in-del'); if(del) del.onclick=()=>{ brandingInputs=brandingInputs.filter(i=>i.id!==brandingInputEditingId); saveKey(BRANDING_INPUTS_KEY,brandingInputs); brandingInputEditingId=null; render(); };
    document.getElementById('in-save').onclick=()=>{
      const title=document.getElementById('in-title').value.trim();
      if(!title){ alert('제목을 입력해주세요'); return; }
      const isNew = brandingInputEditingId==='new' || !brandingInputs.find(i=>i.id===brandingInputEditingId);
      const existingType = isNew ? (inputTypeSelected||'독서') : (inputTypeSelected || brandingInputs.find(i=>i.id===brandingInputEditingId).type);
      const data={ type:existingType, title, note:document.getElementById('in-note').value.trim(), contentified:document.getElementById('in-contentified').checked, date:new Date().toISOString().slice(0,10) };
      if(isNew){ brandingInputs.push({id:uid('input'), ...data}); } else { const idx=brandingInputs.findIndex(i=>i.id===brandingInputEditingId); brandingInputs[idx]={...brandingInputs[idx], ...data}; }
      saveKey(BRANDING_INPUTS_KEY,brandingInputs); brandingInputEditingId=null; render();
    };
  }

  // annual
  const editAnnualBtn=document.getElementById('editAnnualBtn'); if(editAnnualBtn) editAnnualBtn.onclick=()=>{ brandingAnnualEditing=true; render(); };
  const annualOverlay=document.getElementById('annualOverlay');
  if(annualOverlay){
    const year=new Date().getFullYear().toString();
    annualOverlay.onclick=(e)=>{ if(e.target.id==='annualOverlay'){ brandingAnnualEditing=false; render(); } };
    document.getElementById('an-cancel').onclick=()=>{ brandingAnnualEditing=false; render(); };
    document.getElementById('an-save').onclick=()=>{
      const data={ targetRevenue:Number(document.getElementById('an-tr').value)||0, actualRevenue:Number(document.getElementById('an-ar').value)||0, targetProducts:Number(document.getElementById('an-tp').value)||0, targetFollowers:Number(document.getElementById('an-tf').value)||0, actualFollowers:Number(document.getElementById('an-af').value)||0, note:document.getElementById('an-note').value.trim() };
      const existing=brandingAnnual.find(x=>x.year===year);
      if(existing){ Object.assign(existing,data); } else { brandingAnnual.push({id:uid('annual'), year, ...data}); }
      saveKey(BRANDING_ANNUAL_KEY,brandingAnnual); brandingAnnualEditing=false; render();
    };
  }

  // log
  const newLogBtn=document.getElementById('newBrandingLogBtn'); if(newLogBtn) newLogBtn.onclick=()=>{ brandingLogEditingId='new'; render(); };
  document.querySelectorAll('[data-brandinglog]').forEach(el=>{ el.onclick=()=>{ brandingLogEditingId=el.dataset.brandinglog; render(); }; });
  const logOverlay=document.getElementById('brandingLogOverlay');
  if(logOverlay){
    logOverlay.onclick=(e)=>{ if(e.target.id==='brandingLogOverlay'){ brandingLogEditingId=null; render(); } };
    document.getElementById('bl-cancel').onclick=()=>{ brandingLogEditingId=null; render(); };
    const del=document.getElementById('bl-del'); if(del) del.onclick=()=>{ brandingLogs=brandingLogs.filter(l=>l.id!==brandingLogEditingId); saveKey(BRANDING_LOG_KEY,brandingLogs); brandingLogEditingId=null; render(); };
    document.getElementById('bl-save').onclick=()=>{
      const date=document.getElementById('bl-date').value;
      const note=document.getElementById('bl-note').value.trim();
      if(!note){ alert('내용을 입력해주세요'); return; }
      const isNew = brandingLogEditingId==='new' || !brandingLogs.find(l=>l.id===brandingLogEditingId);
      if(isNew){ brandingLogs.push({id:uid('blog'), date, note}); } else { const idx=brandingLogs.findIndex(l=>l.id===brandingLogEditingId); brandingLogs[idx]={...brandingLogs[idx], date, note}; }
      saveKey(BRANDING_LOG_KEY,brandingLogs); brandingLogEditingId=null; render();
    };
  }
}

function studioAddLayer(type){
  const base = { id: uid('layer'), type };
  if(type==='text'){
    Object.assign(base, { text:'텍스트를 입력하세요', font:'Noto KR', size:28, weight:'Reg', align:'left', color:'#FFFFFF', highlight:'없음', highlightOpacity:50, x:50, y:50 });
  } else {
    Object.assign(base, { image:null, scale:100, x:50, y:50 });
  }
  curPage().layers.push(base);
  studioSelectedId = base.id;
  render();
}

  </div></div>`;
}
function bindStudioSaveLoadModals(){
  const saveOverlay=document.getElementById('studioSaveOverlay');
  if(saveOverlay){
    saveOverlay.onclick=(e)=>{ if(e.target.id==='studioSaveOverlay'){ studioSaveModalOpen=false; render(); } };
    document.getElementById('ssv-cancel').onclick=()=>{ studioSaveModalOpen=false; render(); };
    const saveAsBtn=document.getElementById('ssv-saveas');
    if(saveAsBtn) saveAsBtn.onclick=()=>{
      const name=document.getElementById('ssv-name').value.trim()||'표지 세트';
      const entry={ id:uid('save'), name, savedAt:Date.now(), pages:JSON.parse(JSON.stringify(studioPages)) };
      studioSaves.push(entry); saveKey(STUDIO_SAVES_KEY,studioSaves);
      studioCurrentSaveId=entry.id; studioSaveModalOpen=false; render();
    };
    document.getElementById('ssv-save').onclick=()=>{
      const name=document.getElementById('ssv-name').value.trim()||'표지 세트';
      const existing = studioCurrentSaveId ? studioSaves.find(s=>s.id===studioCurrentSaveId) : null;
      if(existing){ existing.name=name; existing.savedAt=Date.now(); existing.pages=JSON.parse(JSON.stringify(studioPages)); }
      else{ const entry={ id:uid('save'), name, savedAt:Date.now(), pages:JSON.parse(JSON.stringify(studioPages)) }; studioSaves.push(entry); studioCurrentSaveId=entry.id; }
      saveKey(STUDIO_SAVES_KEY,studioSaves);
      studioSaveModalOpen=false; render();
    };
  }
  const loadOverlay=document.getElementById('studioLoadOverlay');
  if(loadOverlay){
    loadOverlay.onclick=(e)=>{ if(e.target.id==='studioLoadOverlay'){ studioLoadModalOpen=false; render(); } };
    document.getElementById('sld-cancel').onclick=()=>{ studioLoadModalOpen=false; render(); };
    document.querySelectorAll('[data-loadsave]').forEach(el=>{
      el.onclick=(ev)=>{
        if(ev.target.dataset.delsave) return;
        const s=studioSaves.find(x=>x.id===el.dataset.loadsave);
        if(!s) return;
        studioPages = JSON.parse(JSON.stringify(s.pages));
        studioCurrentPageId = studioPages[0].id;
        studioCurrentSaveId = s.id;
        studioSelectedId=null;
        studioLoadModalOpen=false;
        render();
      };
    });
    document.querySelectorAll('[data-delsave]').forEach(el=>{
      el.onclick=(ev)=>{
        ev.stopPropagation();
        studioSaves=studioSaves.filter(s=>s.id!==el.dataset.delsave);
        saveKey(STUDIO_SAVES_KEY,studioSaves);
        if(studioCurrentSaveId===el.dataset.delsave) studioCurrentSaveId=null;
        render();
      };
    });
  }
}

function studioRenderLayer(l){

    const hlBg = l.highlight==='형광펜' ? `background:linear-gradient(to bottom, transparent 55%, rgba(255,235,59,${(l.highlightOpacity||50)/100}) 55%);` : '';
    return `<div class="studio-layer ${studioSelectedId===l.id?'selected':''}" data-layer="${l.id}" style="left:${l.x}%;top:${l.y}%;font-family:${STUDIO_FONTS[l.font]||'inherit'};font-size:${l.size}px;font-weight:${STUDIO_WEIGHTS[l.weight]||400};color:${l.color};text-align:${l.align};${hlBg}">${escapeHtml(l.text).replace(/\n/g,'<br>')}</div>`;
  }
  return `<div class="studio-layer ${studioSelectedId===l.id?'selected':''}" data-layer="${l.id}" style="left:${l.x}%;top:${l.y}%;">${l.image?`<img src="${l.image}" style="width:${l.scale}px;">`:''}</div>`;
}

function bindStudioEvents(){
  const p = curPage();

  const openSaveBtn=document.getElementById('studioOpenSaveBtn'); if(openSaveBtn) openSaveBtn.onclick=()=>{ studioSaveModalOpen=true; render(); };
  const openLoadBtn=document.getElementById('studioOpenLoadBtn'); if(openLoadBtn) openLoadBtn.onclick=()=>{ studioLoadModalOpen=true; render(); };
  bindStudioSaveLoadModals();

  document.getElementById('studioAddPageBtn').onclick = ()=>{
    const np = makeBlankPage('표지 '+(studioPages.length+1));
    studioPages.push(np); studioCurrentPageId=np.id; studioSelectedId=null; render();
  };
  document.querySelectorAll('[data-page]').forEach(el=>{ el.onclick=()=>{ studioCurrentPageId=el.dataset.page; studioSelectedId=null; render(); }; });
  document.querySelectorAll('[data-delpage]').forEach(el=>{ el.onclick=(ev)=>{
    ev.stopPropagation();
    studioPages = studioPages.filter(pg=>pg.id!==el.dataset.delpage);
    if(studioCurrentPageId===el.dataset.delpage){ studioCurrentPageId = studioPages[0].id; studioSelectedId=null; }
    render();
  }; });

  document.querySelectorAll('.studio-format-tabs .sf').forEach(el=>{ el.onclick=()=>{ p.format=el.dataset.format; render(); }; });
  document.querySelectorAll('[data-bgtype]').forEach(el=>{ el.onclick=()=>{ p.bg.type=el.dataset.bgtype; render(); }; });
  document.querySelectorAll('[data-swatch]').forEach(el=>{ el.onclick=()=>{ p.bg.color=el.dataset.swatch; render(); }; });
  const bgColor=document.getElementById('studioBgColor'); if(bgColor) bgColor.oninput=(e)=>{ p.bg.color=e.target.value; render(); };
  const bgHex=document.getElementById('studioBgHex'); if(bgHex) bgHex.onchange=(e)=>{
    let v=e.target.value.trim(); if(!v.startsWith('#')) v='#'+v;
    if(/^#[0-9A-Fa-f]{6}$/.test(v)){ p.bg.color=v; render(); } else { alert('#RRGGBB 형식으로 입력해주세요'); }
  };
  const bgUpload=document.getElementById('studioBgUpload'); if(bgUpload) bgUpload.onchange=(e)=>{
    const file=e.target.files[0]; if(!file) return;
    const reader=new FileReader(); reader.onload=()=>{ p.bg.image=reader.result; render(); }; reader.readAsDataURL(file);
  };
